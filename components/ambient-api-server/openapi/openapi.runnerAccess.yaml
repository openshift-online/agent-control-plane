paths:
  /api/ambient/v1/sessions/{id}/runner/access:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Check session read permission for runner access
      description: Checks the authenticated caller's session role and scope. Does not change the session or contact its runner. A successful result applies only to this request.
      security:
        - Bearer: []
      responses:
        '204':
          description: Access is allowed
        '401':
          description: User authentication is required
        '403':
          description: The caller does not have the required session permission
        '404':
          description: The session does not exist
        '500':
          description: The permission check failed
