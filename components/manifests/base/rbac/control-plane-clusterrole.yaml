apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ambient-control-plane
rules:
# Namespaces (create and label per-project namespaces)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# RoleBindings (reconcile group access from ProjectSettings)
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# ConfigMaps (watch platform-config, create/delete configs including CA bundles)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
# Session runner resources (provision/deprovision per-session workloads in project namespaces)
- apiGroups: [""]
  resources: ["secrets", "serviceaccounts", "services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# NetworkPolicies (session isolation + API server access)
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
# Nodes (read node info for scheduling)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Events (watch for reconciliation)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# OpenShift Routes (session access via passthrough Routes in project namespaces)
- apiGroups: ["route.openshift.io"]
  resources: ["routes", "routes/custom-host"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Sandboxes (OpenShell agent CRD)
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes", "sandboxes/status"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
