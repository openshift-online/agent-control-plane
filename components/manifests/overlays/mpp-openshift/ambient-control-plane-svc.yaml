apiVersion: v1
kind: Service
metadata:
  name: ambient-control-plane
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ambient-control-plane-tls
  namespace: ambient-code--runtime-int
  labels:
    app: ambient-control-plane
spec:
  selector:
    app: ambient-control-plane
  ports:
    - name: token
      port: 8080
      targetPort: 8080
      protocol: TCP
