version: 1
rules:
  # subprocess calls in CI helper scripts — expected for tooling
  - id: "AST4"
    path: ".github/scripts/*"
    reason: "CI helper scripts legitimately use subprocess for gcloud/gh/git"

  # sudo in CI workflows — standard for GitHub Actions runners
  - id: "PE2"
    reason: "CI workflows install system packages on ephemeral runners"

  # Autonomous decision making in reconcile/deploy skills — their purpose
  - id: "EA2"
    reason: "Reconcile and deploy skills are designed for autonomous operation"

  # Unpinned MCP server versions via npx — these are test runners, not MCP servers
  - id: "RP1"
    reason: "npx jest/vitest/playwright are test runners, not MCP servers"

  # CI workflow shell commands — not agent-controlled tool calls
  - id: "TM*"
    path: ".github/workflows/*"
    reason: "CI workflow shell commands in GitHub Actions, not agent-controlled tool calls"

  # External transmission in CI — workflows posting to trusted internal APIs
  - id: "E1"
    path: ".github/workflows/*"
    reason: "CI workflows communicating with trusted internal services"

  # Vertex AI model discovery — legitimate GCP API auth in CI
  - id: "TT3"
    path: ".github/scripts/model-discovery.py"
    reason: "CI job authenticates to Vertex AI via WIF/gcloud; bearer tokens in Authorization headers are expected"

  - id: "PE3"
    path: ".github/scripts/model-discovery.py"
    reason: "CI job obtains GCP access token via gcloud for Vertex AI Model Garden API"

  # Deploy skill documents credential sidecar providers and OIDC token types — not file-path credential access
  - id: "PE3"
    path: "skills/deploy/deploy-cluster/SKILL.md"
    reason: "Architecture docs naming Kubeconfig provider and OIDC token types; no credential path access"

  # Feedback loop uploads correction-derived prompts to GHA artifacts — review privacy scope
  - id: "E4"
    path: ".github/workflows/feedback-loop.yml"
    reason: "Known: sessions.json carries Langfuse correction summaries to ambient-action; revisit data minimization and retention"
